[project]
name = "iosstudio-mcp"
version = "0.1.0"
description = "MCP server for iOS Studio: lets AI coding agents build, run and debug iPhone apps on Omarchy Linux"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.7,<3",
    "pillow>=10",
]

[project.scripts]
iosstudio-mcp = "iosstudio_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iosstudio_mcp"]
