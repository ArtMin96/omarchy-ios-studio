# The ruff rules CI gates on: pyflakes (F) and pycodestyle's real errors (E4, E7, E9), no style rules.
# Run locally: uvx ruff@0.17.4 check --config .github/ruff-ci.toml helper mcp tests
target-version = "py311"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E731",  # a lambda assigned to a name: used on purpose for small callbacks
    "E741",  # ambiguous names such as `l`: short loop variables, not bugs
]
